name: Foundation Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start evidence record
        id: start
        run: |
          run_id="$(go run ./cmd/dev run new --spec specs/0001-foundation)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Validate candidate
        id: checks
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
        run: go run ./cmd/dev check --run "$RUN_ID" --race

      - name: Cross-compile darwin and windows
        id: cross_compile
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
        run: |
          set -euo pipefail
          log_rel="evidence/cross-compile.log"
          log_path=".agent/runs/$RUN_ID/$log_rel"
          mkdir -p "$(dirname "$log_path")"
          run_cross() {
            for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
              os="${target%/*}"
              arch="${target#*/}"
              echo "=== $os/$arch (CGO_ENABLED=0) ==="
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go vet ./... || return $?
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build ./... || return $?
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go vet -tags e2e ./... || return $?
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -tags e2e ./... || return $?
            done
          }
          status=0
          run_cross 2>&1 | tee "$log_path" || status=$?
          if [ "$status" -eq 0 ]; then
            go run ./cmd/dev run note --id "$RUN_ID" --phase validation --message "Cross-compile vet/build (default and e2e) passed for darwin/{amd64,arm64} and windows/{amd64,arm64}" --evidence "$log_rel"
          else
            go run ./cmd/dev run note --id "$RUN_ID" --phase validation --message "Cross-compile vet/build failed for darwin/windows targets" --evidence "$log_rel"
            exit "$status"
          fi

      - name: Record execution outcome (not approval)
        if: always() && steps.start.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
          CROSS_OUTCOME: ${{ steps.cross_compile.outcome }}
        run: |
          if [ "$CHECK_OUTCOME" = "success" ] && [ "$CROSS_OUTCOME" = "success" ]; then
            go run ./cmd/dev run finish --id "$RUN_ID" --outcome succeeded --message "Foundation checks and darwin/windows cross-compile passed on $RUNNER_OS; independent review still required"
          else
            go run ./cmd/dev run finish --id "$RUN_ID" --outcome failed --message "CI checks did not pass on $RUNNER_OS (checks=$CHECK_OUTCOME, cross_compile=$CROSS_OUTCOME)"
          fi

      - name: Preserve CI evidence
        if: always() && steps.start.outputs.run_id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: foundation-ubuntu-24.04-${{ github.run_attempt }}
          path: .agent/runs/${{ steps.start.outputs.run_id }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
